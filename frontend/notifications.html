<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Bibliothèques d'Île‑de‑France</title>
    <link rel="stylesheet" href="css/notification.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" href="resources/logo_pic.png" type="image/png">
</head>
<body>
<div class="main-wrapper">
    <div class="background-image"></div>

    <nav>
        <div class="logo">Bibliothèques IDF</div>
        <ul class="nav-links">
            <li><a href="MyFeed.html">Accueil</a></li>
            <li><a href="recherche.html">Recherche</a></li>
            <li><a href="livres.html">Livres</a></li>
            <li><a href="feed.html">Feed Social</a></li>
            <li><a href="favoris.html">Mes Favoris</a></li>
            <li><a href="sessions.html">Sessions</a></li>
            <li><a href="notifications.html">Notifications</a></li>
            <li><a href="login.html" id="auth-link">Connexion</a></li>
            <li><a href="profile.html">Mon Profil</a></li>
        </ul>
        <div class="search-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </div>
    </nav>

    <main class="content-overlay">

        <!-- En-tête -->
        <div class="page-header">
            <div>
                <h1>Notifications</h1>
                <p class="page-sub">Restez informé de tout ce qui compte pour vous</p>
            </div>
            <div class="header-badge" id="header-badge" style="display:none">
                <span id="badge-count">0</span> non lues
            </div>
        </div>

        <!-- Résumé par catégorie -->
        <section class="category-summary" id="category-summary">
            <!-- Généré par JS -->
        </section>

        <!-- Barre d'outils -->
        <div class="notif-toolbar">
            <div class="filter-tabs" id="filter-tabs">
                <button class="filter-tab active" data-filter="tous">
                    Toutes <span class="tab-count" id="count-tous">0</span>
                </button>
                <button class="filter-tab" data-filter="non-lues">
                    Non lues <span class="tab-count" id="count-non-lues">0</span>
                </button>
                <button class="filter-tab" data-filter="LIVRE_DISPONIBLE,RECHERCHE_LIVRE,RAPPEL_LECTURE">
                    <i class="fas fa-book"></i> Livres
                </button>
                <button class="filter-tab" data-filter="NOUVELLE_PUBLICATION">
                    <i class="fas fa-users"></i> Social
                </button>
                <button class="filter-tab" data-filter="SESSION_REMINDER,OBJECTIF_ATTEINT">
                    <i class="fas fa-clock"></i> Sessions
                </button>
                <button class="filter-tab" data-filter="FERMETURE_BIBLIOTHEQUE,AFFLUENCE_FAIBLE,NOUVELLE_BIBLIOTHEQUE,RECOMMANDATION">
                    <i class="fas fa-building-columns"></i> Bibliothèques
                </button>
            </div>
            <div class="toolbar-actions">
                <button class="btn-action" onclick="marquerToutesCommeLues()">
                    <i class="fas fa-check-double"></i> Tout lire
                </button>
                <button class="btn-action btn-outline" onclick="supprimerNotificationsLues()">
                    <i class="fas fa-broom"></i> Nettoyer
                </button>
            </div>
        </div>

        <!-- Liste notifications -->
        <div id="notifications-container" class="notif-list">
            <div class="notif-loading">
                <i class="fas fa-spinner fa-spin"></i> Chargement...
            </div>
        </div>

    </main>
</div>

<script src="js/api.js"></script>
<script src="js/notifications.js"></script>
</body>
</html>
